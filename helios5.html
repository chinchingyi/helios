<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helios 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }

        #app-title { position: absolute; top: 25px; left: 30px; z-index: 5; pointer-events: none; }
        #app-title h1 { margin: 0; font-size: 28px; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(79, 195, 247, 0.8); text-transform: uppercase; display: flex; align-items: baseline; }
        .version-tag { font-size: 14px; background: linear-gradient(45deg, #7b1fa2, #e040fb); padding: 2px 8px; border-radius: 4px; margin-left: 15px; color: #fff; font-weight: 900; box-shadow: 0 0 15px rgba(224, 64, 251, 0.6); border: 1px solid #fff; }
        #app-title span.subtitle { display: block; font-size: 14px; color: #4fc3f7; margin-top: 5px; letter-spacing: 1px; }

        #ui-panel { position: absolute; top: 25px; right: 25px; width: 260px; background: rgba(16, 24, 40, 0.9); backdrop-filter: blur(12px); padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); z-index: 10; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .ui-group { margin-bottom: 20px; }
        .ui-group label { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #90caf9; font-weight: 600; }
        button { background: linear-gradient(135deg, #0288d1, #01579b); border: none; color: white; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(2,136,209,0.4); }
        .checkbox-label { display: flex; align-items: center; cursor: pointer; color: #e1f5fe; }

        #planet-info-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            width: 440px; max-width: 90vw;
            background: rgba(10, 20, 35, 0.98); backdrop-filter: blur(20px);
            border: 1px solid rgba(79, 195, 247, 0.5); border-radius: 20px;
            z-index: 100; opacity: 0; visibility: hidden; transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }
        #planet-info-modal.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        .modal-header {
            background: linear-gradient(90deg, #0277bd, #004c8c);
            padding: 20px 25px;
            position: relative;
            text-align: center;
        }
        .modal-header h2 { margin: 0; font-size: 26px; color: #fff; font-weight: 700; }
        .close-btn {
            position: absolute; top: 16px; right: 16px;
            background: rgba(0,0,0,0.3); border: none; border-radius: 50%;
            color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.15); }

        .modal-body { padding: 25px; max-height: 60vh; overflow-y: auto; }
        .modal-body p { margin: 0; font-size: 15px; line-height: 1.9; color: #cfd8dc; text-align: justify; }

        .modal-footer {
            padding: 15px 25px; border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 12px; color: #ffd54f; display: flex; justify-content: space-between; align-items: center;
        }

        #tooltip { position: absolute; display: none; padding: 8px 16px; background: rgba(0,0,0,0.8); border: 1px solid #4fc3f7; border-radius: 4px; color: #fff; font-size: 14px; font-weight: bold; pointer-events: none; z-index: 20; }
        #controls-hint { position: absolute; bottom: 25px; width: 100%; text-align: center; color: rgba(255,255,255,0.4); font-size: 13px; pointer-events: none; }

        .label {
            position: absolute; color: white; font-size: 12px; font-weight: bold;
            text-shadow: 0 0 8px rgba(0,0,0,0.9); pointer-events: none; white-space: nowrap;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="app-title">
        <h1>Helios 3D <span class="version-tag">v5</span></h1>
     </div>
    <div id="canvas-container"></div>
    <div id="tooltip"></div>

    <div id="planet-info-modal">
        <div class="modal-header">
            <h2 id="modal-name">星球名稱</h2>
            <button class="close-btn" id="close-modal">×</button>
        </div>
        <div class="modal-body"><p id="modal-desc">詳細介紹...</p></div>
        <div class="modal-footer">
            <span id="modal-type">天體類型</span>
            <span>已鎖定視角 (點擊 × 或按 ESC 解鎖)</span>
        </div>
    </div>

    <div id="ui-panel">
        <div class="ui-group"><button id="reset-camera">重置視角 (Reset)</button></div>
        <div class="ui-group">
            <label>公轉速度 <span id="speed-val">1.0x</span></label>
            <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1">
        </div>
        <div class="ui-group"><button id="pause-btn">暫停 / 播放 (Space)</button></div>
        <div class="ui-group">
            <label class="checkbox-label"><input type="checkbox" id="show-orbits" checked> 顯示軌道線</label>
        </div>
        <div class="ui-group">
            <label class="checkbox-label"><input type="checkbox" id="show-labels" checked> 顯示名稱標籤</label>
        </div>
    </div>
    <div id="controls-hint">左鍵點擊星球/衛星：查看詳情 | 滾輪：縮放 | 右鍵：平移 | ESC：關閉資訊卡</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import TWEEN from 'https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.00008);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 10000);
        camera.position.set(0, 250, 450);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.minDistance = 30;
        controls.maxDistance = 2000;
        controls.zoomSpeed = 1.2;

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const pointLight = new THREE.PointLight(0xffffff, 1.5, 0, 0);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        function createTexture(type, color1, color2) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color1; ctx.fillRect(0, 0, 512, 256);
            if (type === 'noise') {
                for (let i = 0; i < 5000; i++) {
                    ctx.fillStyle = color2; ctx.globalAlpha = 0.3;
                    ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*256, Math.random()*3+1, 0, Math.PI*2); ctx.fill();
                }
            } else if (type === 'stripes') {
                for (let i = 0; i < 256; i+=10) {
                    ctx.fillStyle = Math.random() > 0.5 ? color2 : color1;
                    ctx.globalAlpha = 0.4;
                    ctx.fillRect(0, i, 512, Math.random()*10+5);
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createRingTexture(innerColor, outerColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(128, 128, 60, 128, 128, 120);
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            gradient.addColorStop(0.2, innerColor);
            gradient.addColorStop(0.8, outerColor);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            tex.rotation = -Math.PI / 2;
            return tex;
        }

        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<3000; i++) {
            const r = 3000 * Math.random() + 500;
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);
            starPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.5})));

        const interactionObjects = [];

        // 太陽
        const sunGeo = new THREE.SphereGeometry(22, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        const glowCanvas = document.createElement('canvas');
        glowCanvas.width = 128; glowCanvas.height = 128;
        const gCtx = glowCanvas.getContext('2d');
        const grd = gCtx.createRadialGradient(64,64,0,64,64,64);
        grd.addColorStop(0, "rgba(255, 170, 0, 1)");
        grd.addColorStop(0.4, "rgba(255, 100, 0, 0.3)");
        grd.addColorStop(1, "rgba(0,0,0,0)");
        gCtx.fillStyle = grd; gCtx.fillRect(0,0,128,128);
        const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(glowCanvas), transparent: true, blending: THREE.AdditiveBlending }));
        sunGlow.scale.set(150, 150, 1); sunGlow.raycast = () => {};
        sun.add(sunGlow);
        sun.userData = {
            name: "太陽 (Sun)", type: "恆星",
            desc: "<b>基本介紹：</b><br>太陽是太陽系的中心恆星，也是系內唯一的發光天體。它是一顆 G 型主序星（黃矮星），約佔太陽系總質量的 99.86%。<br><br><b>成分與能量：</b><br>太陽的主要成分是氫（約 73%）和氦（約 25%）。透過核心極高溫高壓下的核融合反應，將氫轉化為氦，並釋放出巨大的能量。<br><br><b>影響：</b><br>它是地球上生命存在的主要能量來源，驅動著地球的氣候和天氣系統。太陽的強大引力將所有行星束縛在軌道上。"
        };
        scene.add(sun);
        interactionObjects.push(sun);

        // 行星與衛星資料
        const planetsConfig = [
            { name: "水星", r: 3.5, d: 50, s: 0.02, c1: "#aaaaaa", c2: "#888888", type: "noise", desc: "<b>水星 (Mercury)：</b><br>水星是太陽系中最小且最靠近太陽的行星。由於缺乏大氣層保護，其晝夜溫差極大，白天可達 430°C，夜晚降至 -180°C。表面佈滿隕石坑，外觀與月球相似。" },
            { name: "金星", r: 5.8, d: 80, s: 0.012, c1: "#e6db99", c2: "#d4c472", type: "noise", desc: "<b>金星 (Venus)：</b><br>金星被厚厚的二氧化碳大氣層覆蓋，產生失控的溫室效應，表面溫度高達 465°C，是太陽系最熱的行星。它的自轉方向與其他行星相反（逆向自轉）。" },
            { name: "地球", r: 6, d: 110, s: 0.01, c1: "#1e88e5", c2: "#4caf50", type: "noise", desc: "<b>地球 (Earth)：</b><br>我們的家園，目前已知唯一孕育生命的星球。表面約 71% 被海洋覆蓋，呈現美麗的藍色。擁有富含氧氣的大氣層和保護性的磁場。" },
            { name: "火星", r: 4.5, d: 150, s: 0.008, c1: "#d84315", c2: "#bf360c", type: "noise", desc: "<b>火星 (Mars)：</b><br>被稱為「紅色星球」，因表面遍佈氧化鐵（鐵鏽）。它擁有太陽系最高的火山「奧林帕斯山」和巨大的峽谷系統。科學家致力於在此尋找過去生命的痕跡。", moons: [
                {name: "火衛一 (Phobos)", size: 0.6, dist: 8, speed: 0.08, color: "#999999", desc: "<b>火衛一 (Phobos)：</b><br>火星較大且較近的衛星，直徑約 22 公里，表面佈滿隕石坑，最大的一個名為 Stickney。它距離火星非常近，每天繞火星公轉三圈以上，正逐漸螺旋靠近火星，未來數千萬年後可能撞上火星或被撕裂成環。" },
                {name: "火衛二 (Deimos)", size: 0.4, dist: 12, speed: 0.04, color: "#888888", desc: "<b>火衛二 (Deimos)：</b><br>火星較小的衛星，直徑約 12 公里，形狀不規則，表面同樣佈滿隕石坑。它距離火星較遠，公轉週期約 30 小時。科學家認為火衛一與火衛二可能是被火星捕獲的小行星，因其成分與 C 型小行星相似。" }
            ] },
            { name: "木星", r: 14, d: 220, s: 0.004, c1: "#d8ca9d", c2: "#a1887f", type: "stripes", desc: "<b>木星 (Jupiter)：</b><br>太陽系最大的行星，質量是其他行星總和的 2.5 倍。它是一顆氣體巨行星，擁有標誌性的「大紅斑」風暴和色彩斑斕的雲帶。", moons: [
                {name: "伊奧 (Io)", size: 1.8, dist: 22, speed: 0.06, color: "#ffff99", desc: "<b>伊奧 (Io)：</b><br>木星四顆伽利略衛星中最近的一顆，也是太陽系火山活動最活躍的天體，表面有超過 400 座活火山。這是由於木星與其他衛星的潮汐力造成內部劇烈加熱。伊奧表面呈現黃色與橙色，主要由硫與硫化合物組成。" },
                {name: "歐羅巴 (Europa)", size: 1.6, dist: 28, speed: 0.04, color: "#dddde6", desc: "<b>歐羅巴 (Europa)：</b><br>表面覆蓋厚厚冰層的天體，被認為冰層下存在液態海洋，可能是太陽系中最有可能存在外星生命的場所。它的表面非常平滑，有許多裂痕與線條，顯示冰層之下可能有地質活動。" },
                {name: "伽尼梅 (Ganymede)", size: 2.4, dist: 35, speed: 0.03, color: "#a8a8a8", desc: "<b>伽尼梅德 (Ganymede)：</b><br>太陽系最大的衛星，甚至比水星還大。它擁有自己的磁場，是唯一已知擁有磁場的衛星。表面有古老隕石坑與較年輕的溝槽區域，顯示曾有地質活動。伽尼梅德可能擁有地下海洋。" },
                {name: "卡利斯托 (Callisto)", size: 2.2, dist: 42, speed: 0.02, color: "#777777", desc: "<b>卡利斯托 (Callisto)：</b><br>伽利略衛星中最遠的一顆，表面佈滿隕石坑，是太陽系已知隕石坑密度最高的天體。它受到木星輻射較少，表面非常古老。科學家認為它也有分層結構，可能擁有地下海洋。" }
            ] },
            { name: "土星", r: 12, d: 300, s: 0.003, c1: "#f0e68c", c2: "#bdb76b", type: "stripes", ring: true, desc: "<b>土星 (Saturn)：</b><br>以其壯觀的行星環系統聞名，環由冰塊和岩石組成。土星是密度最小的行星，理論上可以漂浮在水面上。", moons: [
                {name: "泰坦 (Titan)", size: 2.5, dist: 28, speed: 0.03, color: "#f4a460", desc: "<b>泰坦 (Titan)：</b><br>土星最大衛星，也是太陽系第二大衛星。它擁有濃厚的大氣層（比地球還厚），主要由氮與甲烷組成。表面有液態甲烷湖泊與河流，是太陽系唯一已知表面有穩定液體的天體。" },
                {name: "瑞亞 (Rhea)", size: 1.2, dist: 22, speed: 0.04, color: "#cccccc", desc: "<b>瑞亞 (Rhea)：</b><br>土星第二大衛星，表面覆蓋厚厚冰層，佈滿隕石坑。擁有稀薄大氣層（主要是氧與二氧化碳），並可能有極薄的環系統，是科學家研究冰衛星的重要對象。" },
                {name: "土衛六 (Iapetus)", size: 1.1, dist: 35, speed: 0.02, color: "#888888", desc: "<b>土衛六 (Iapetus)：</b><br>以雙色外觀聞名，一半明亮（冰覆蓋），一半極暗（有機物質沉積）。它有直徑超過 1,500 公里的赤道山脊，看起來像核桃，是太陽系最奇特衛星之一。" },
                {name: "迪奧內 (Dione)", size: 1.0, dist: 20, speed: 0.05, color: "#dddddd", desc: "<b>迪奧內 (Dione)：</b><br>表面有明亮冰崖與隕石坑，顯示曾有地質活動。與較小的衛星 Helene 形成共軌關係，並可能擁有地下海洋。" },
                {name: "泰西斯 (Tethys)", size: 1.0, dist: 18, speed: 0.055, color: "#eeeeee", desc: "<b>泰西斯 (Tethys)：</b><br>幾乎完全由水冰組成，表面有巨大隕石坑 Odysseus 與長達 2,000 公里的裂谷 Ithaca Chasma。密度極低，是太陽系最「輕」的衛星之一。" },
                {name: "恩塞拉都斯 (Enceladus)", size: 0.8, dist: 16, speed: 0.06, color: "#f0f0f0", desc: "<b>恩塞拉都斯 (Enceladus)：</b><br>表面光滑明亮，反射率極高。南極有「虎紋」裂縫，從中噴發水羽，證明地下有液態海洋，是搜尋外星生命最熱門的候選天體之一。" },
                {name: "米瑪斯 (Mimas)", size: 0.7, dist: 14, speed: 0.07, color: "#bbbbbb", desc: "<b>米瑪斯 (Mimas)：</b><br>外觀酷似「死星」，因表面有直徑 130 公里的巨大隕石坑 Herschel。幾乎完全由水冰組成，內部可能有地下海洋或異常形狀的核心。" }
            ] },
            { name: "天王星", r: 8, d: 380, s: 0.002, c1: "#80deea", c2: "#4dd0e1", type: "noise", desc: "<b>天王星 (Uranus)：</b><br>這顆冰巨行星因大氣中的甲烷而呈現淡藍色。最獨特的是它的自轉軸傾斜 98 度，幾乎是「躺著」繞太陽公轉。", moons: [
                {name: "蒂塔妮亞 (Titania)", size: 1.2, dist: 20, speed: 0.04, color: "#cccccc", desc: "<b>蒂塔妮亞 (Titania)：</b><br>天王星最大衛星，表面有巨大峽谷、斷層與隕石坑，顯示曾有內部地質活動。可能擁有地下海洋，是冰衛星研究的典型代表。" },
                {name: "奧伯龍 (Oberon)", size: 1.1, dist: 23, speed: 0.035, color: "#aaaaaa", desc: "<b>奧伯龍 (Oberon)：</b><br>天王星最外層主要衛星，表面古老佈滿隕石坑，有些坑底有暗色物質。可能是分層結構，擁有冰殼與岩石核心。" },
                {name: "昂布瑞爾 (Umbriel)", size: 1.0, dist: 18, speed: 0.045, color: "#777777", desc: "<b>昂布瑞爾 (Umbriel)：</b><br>天王星衛星中最暗的一顆，表面反射率低，可能覆蓋有機物質。佈滿古老隕石坑，幾乎沒有地質活動痕跡。" },
                {name: "艾瑞爾 (Ariel)", size: 1.0, dist: 16, speed: 0.05, color: "#dddddd", desc: "<b>艾瑞爾 (Ariel)：</b><br>天王星最明亮的衛星，表面有廣泛裂谷與峽谷，顯示曾有強烈地質活動（可能因潮汐加熱或冰火山）。年輕表面覆蓋明亮冰層。" },
                {name: "米蘭達 (Miranda)", size: 0.7, dist: 14, speed: 0.06, color: "#bbbbbb", desc: "<b>米蘭達 (Miranda)：</b><br>天王星衛星中最奇特的一顆，表面有巨大斷崖（高達 20 公里）與奇異地形，看起來像被打碎又重新組合。可能是過去碰撞後重組形成。" }
            ] },
            { name: "海王星", r: 7.8, d: 450, s: 0.0018, c1: "#304ffe", c2: "#1a237e", type: "noise", desc: "<b>海王星 (Neptune)：</b><br>距離太陽最遠的行星，呈現深藍色。儘管寒冷，它卻擁有太陽系最強烈的風暴，風速可達每小時 2,100 公里。", moons: [
                {name: "崔頓 (Triton)", size: 2.0, dist: 22, speed: 0.04, color: "#dddde6", desc: "<b>崔頓 (Triton)：</b><br>海王星最大衛星，也是太陽系最冷的天體之一，表面溫度約 -235°C。它擁有逆行軌道（與海王星自轉相反），被認為是被海王星捕獲的柯伊伯帶天體。表面有冰火山噴發氮氣羽流，呈現粉紅色氮冰。" },
                {name: "普羅透斯 (Proteus)", size: 1.0, dist: 18, speed: 0.05, color: "#888888", desc: "<b>普羅透斯 (Proteus)：</b><br>海王星第二大衛星，形狀不規則，表面佈滿隕石坑，最大的一個名為 Pharos。它可能是海王星形成時殘留的碎片，未被重力塑造成球形。" }
            ] }
        ];

        const planetMeshes = {};
        const moonData = [];
        const labels = {};

        function createLabel(text) {
            const div = document.createElement('div');
            div.className = 'label';
            div.textContent = text;
            document.body.appendChild(div);
            return div;
        }

        function updateLabel(label, position) {
            if (!document.getElementById('show-labels').checked) {
                label.style.display = 'none';
                return;
            }
            label.style.display = 'block';
            const vector = position.clone().project(camera);
            const widthHalf = window.innerWidth / 2;
            const heightHalf = window.innerHeight / 2;
            label.style.left = (vector.x * widthHalf + widthHalf) + 'px';
            label.style.top = (-vector.y * heightHalf + heightHalf) + 'px';
            const distance = camera.position.distanceTo(position);
            const scale = Math.max(0.5, 350 / distance);
            label.style.fontSize = (12 * scale) + 'px';
            label.style.opacity = Math.min(1, 900 / distance);
        }

        planetsConfig.forEach(p => {
            const orbitGeo = new THREE.RingGeometry(p.d - 0.2, p.d + 0.2, 128);
            orbitGeo.rotateX(-Math.PI/2);
            scene.add(new THREE.Mesh(orbitGeo, new THREE.MeshBasicMaterial({ color: 0x555555, side: THREE.DoubleSide, transparent: true, opacity: 0.3 })));

            const tex = createTexture(p.type, p.c1, p.c2);
            const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, metalness: 0.1 });
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.r, 64, 64), mat);
            mesh.userData = { name: p.name, type: "行星", desc: p.desc, distance: p.d, speed: p.s, angle: Math.random()*6 };
            scene.add(mesh);
            interactionObjects.push(mesh);
            planetMeshes[p.name] = mesh;

            labels[mesh.id] = createLabel(p.name);

            if(p.ring) {
                const ringGeo = new THREE.RingGeometry(p.r*1.4, p.r*2.2, 64);
                ringGeo.rotateX(-Math.PI/2);
                const pos = ringGeo.attributes.position;
                for(let i=0; i<pos.count; i++) {
                    const v3 = new THREE.Vector3().fromBufferAttribute(pos, i);
                    ringGeo.attributes.uv.setXY(i, 0.5, (v3.length()-p.r*1.4)/(p.r*0.8));
                }
                const rMat = new THREE.MeshStandardMaterial({
                    map: createRingTexture('rgba(210,180,140,0.9)', 'rgba(100,90,70,0.6)'),
                    side: THREE.DoubleSide, transparent: true, opacity: 0.9
                });
                const ring = new THREE.Mesh(ringGeo, rMat);
                ring.rotation.x = 0.3;
                mesh.add(ring);
            }

            if(p.name === "天王星") mesh.rotation.z = 1.5;

            if (p.moons) {
                p.moons.forEach(moon => {
                    const mTex = createTexture("noise", moon.color, "#666666");
                    const mMat = new THREE.MeshStandardMaterial({ map: mTex, roughness: 0.8, metalness: 0.1 });
                    const mMesh = new THREE.Mesh(new THREE.SphereGeometry(moon.size, 32, 32), mMat);
                    mMesh.userData = {
                        name: moon.name,
                        type: "衛星",
                        desc: moon.desc,
                        parentPlanet: p.name,
                        moonDist: moon.dist,
                        moonSpeed: moon.speed,
                        moonAngle: Math.random() * Math.PI * 2
                    };
                    scene.add(mMesh);
                    interactionObjects.push(mMesh);
                    moonData.push({ mesh: mMesh, parent: mesh });

                    if (moon.size > 0.7) {
                        labels[mMesh.id] = createLabel(moon.name);
                    }
                });
            }
        });

        // 地球的月球（只建立一次）
        const earthObj = planetMeshes["地球"];
        const mTex = createTexture("noise", "#dddddd", "#999999");
        const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), new THREE.MeshStandardMaterial({map: mTex}));
        moonMesh.userData = { 
            name: "月球", 
            type: "衛星", 
            desc: "<b>月球 (The Moon)：</b><br>地球唯一的天然衛星。它被地球潮汐鎖定，永遠以同一面朝向我們。月球對地球的潮汐和自轉軸穩定起著至關重要的作用。", 
            moonDist: 12, 
            moonSpeed: 0.05, 
            moonAngle: 0 
        };
        scene.add(moonMesh);
        interactionObjects.push(moonMesh);
        moonData.push({ mesh: moonMesh, parent: earthObj });
        labels[moonMesh.id] = createLabel("月球");

        // 互動與動畫（不變）
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        const modal = document.getElementById('planet-info-modal');
        let focusedObj = null;

        function closeModal() {
            modal.classList.remove('active');
            focusedObj = null;
            new TWEEN.Tween(camera.position).to({ x: 0, y: 250, z: 450 }, 1200).easing(TWEEN.Easing.Cubic.Out).start();
            new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1200).easing(TWEEN.Easing.Cubic.Out).start();
            controls.minDistance = 30;
        }

        document.getElementById('close-modal').onclick = closeModal;
        window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        window.addEventListener('mousemove', e => {
            mouse.x = (e.clientX/window.innerWidth)*2 - 1;
            mouse.y = -(e.clientY/window.innerHeight)*2 + 1;
            tooltip.style.left = (e.clientX + 15) + 'px';
            tooltip.style.top = (e.clientY + 15) + 'px';

            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactionObjects);
            if (hits.length > 0) {
                let obj = hits[0].object;
                if (obj.parent && !obj.userData.name) obj = obj.parent;
                tooltip.style.display = 'block';
                tooltip.innerText = obj.userData.name;
                document.body.style.cursor = 'pointer';
            } else {
                tooltip.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        });

        window.addEventListener('click', e => {
            if (e.target.closest('#ui-panel') || e.target.closest('#planet-info-modal')) return;

            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactionObjects);
            if (hits.length > 0) {
                let obj = hits[0].object;
                if (obj.parent && !obj.userData.name) obj = obj.parent;
                document.getElementById('modal-name').innerText = obj.userData.name;
                document.getElementById('modal-desc').innerHTML = obj.userData.desc;
                document.getElementById('modal-type').innerText = obj.userData.type;
                modal.classList.add('active');
                focusedObj = obj;
                controls.minDistance = obj === sun ? 50 : (obj.geometry.parameters?.radius || 10) * 2.5;
            } else if (modal.classList.contains('active')) {
                closeModal();
            }
        });

        let timeScale = 1.0;
        let isPaused = false;

        document.getElementById('speed-slider').oninput = e => {
            timeScale = parseFloat(e.target.value);
            document.getElementById('speed-val').innerText = timeScale.toFixed(1) + 'x';
        };

        document.getElementById('pause-btn').onclick = function() {
            isPaused = !isPaused;
            this.innerText = isPaused ? "播放 (Space)" : "暫停 / 播放 (Space)";
        };

        document.getElementById('reset-camera').onclick = closeModal;

        document.getElementById('show-labels').onchange = function() { };

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            sun.rotation.y += 0.002;

            if (!isPaused) {
                interactionObjects.forEach(obj => {
                    if (obj.userData.distance) {
                        obj.userData.angle += obj.userData.speed * timeScale;
                        obj.position.set(Math.cos(obj.userData.angle) * obj.userData.distance, 0, Math.sin(obj.userData.angle) * obj.userData.distance);
                        obj.rotation.y += 0.01;
                    }
                });

                moonData.forEach(data => {
                    const m = data.mesh;
                    const dist = m.userData.moonDist || 12;
                    const speed = m.userData.moonSpeed || 0.05;
                    m.userData.moonAngle += speed * timeScale;
                    const parentPos = new THREE.Vector3();
                    data.parent.getWorldPosition(parentPos);
                    m.position.set(parentPos.x + Math.cos(m.userData.moonAngle) * dist, 0, parentPos.z + Math.sin(m.userData.moonAngle) * dist);
                });
            }

            Object.keys(labels).forEach(id => {
                const mesh = scene.getObjectById(parseInt(id));
                if (mesh) {
                    const worldPos = new THREE.Vector3();
                    mesh.getWorldPosition(worldPos);
                    worldPos.y += (mesh.geometry.parameters?.radius || 5) * 1.5;
                    updateLabel(labels[id], worldPos);
                }
            });

            if (focusedObj) {
                const tPos = new THREE.Vector3();
                focusedObj.getWorldPosition(tPos);
                controls.target.lerp(tPos, 0.05);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
